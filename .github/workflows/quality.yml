name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-analysis:
    name: Python static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install analysis tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: Mypy type analysis
        run: python -m mypy app.py converter.py lifecycle.py scripts
      - name: Bandit security analysis
        run: python -m bandit -c pyproject.toml -r app.py converter.py lifecycle.py scripts
      - name: Dead-code analysis
        run: python -m vulture
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt --progress-spinner=off
      - name: Tests and branch coverage
        run: python -m pytest --cov --cov-report=term-missing

  frontend-analysis:
    name: Frontend static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install frontend analyzer
        run: npm ci --ignore-scripts --no-audit
      - name: ESLint
        run: npm run lint
      - name: Frontend behavior tests
        run: npm test
      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  tests:
    name: Tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest

  windows-executable:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Build executable
        shell: pwsh
        run: ./build.ps1 -SkipInstall
      - name: Upload executable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FileconverterAthome-windows
          path: |
            dist/FileconverterAthome.exe
            dist/FileconverterAthome.exe.sha256
          if-no-files-found: error
          retention-days: 14
